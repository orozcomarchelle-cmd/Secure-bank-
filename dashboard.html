<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureBank | Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9679;</span>
      <span class="brand-name">SecureBank</span>
    </div>
    <div class="topbar-right">
      <span id="welcome-name"></span>
      <button id="logout-btn" class="ghost-btn">Log Out</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="balance-card">
      <p class="label">Checking Account &middot; <span id="account-number"></span></p>
      <h2 id="balance">$0.00</h2>
    </section>

    <section class="grid">
      <div class="panel">
        <h3>Transfer Funds</h3>
        <form id="transfer-form" novalidate>
          <label for="recipientName">Recipient Name</label>
          <input type="text" id="recipientName" name="recipientName" required />

          <label for="recipientAccount">Recipient Account Number</label>
          <input type="text" id="recipientAccount" name="recipientAccount" inputmode="numeric" required />

          <label for="amount">Amount (USD)</label>
          <input type="number" id="amount" name="amount" min="0.01" step="0.01" required />

          <label for="memo">Memo (optional)</label>
          <input type="text" id="memo" name="memo" />

          <button type="submit">Send Transfer</button>
          <p id="transfer-message" class="form-message" role="alert"></p>
        </form>
      </div>

      <div class="panel">
        <h3>Recent Transactions</h3>
        <ul id="transactions-list" class="transactions-list">
          <li class="loading">Loading...</li>
        </ul>
      </div>
    </section>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
